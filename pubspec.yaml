name: tokens
description: "PSG Mess Token System - Digital meal token management for hostel students."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1

  # Image Picker & Cropper (Cloudinary Profile Upload)
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # UI & Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  http: ^1.1.0
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/Logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/Logo.png
